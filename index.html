<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hokkien Tangliengim Dictionary</title>
    <meta
      name="description"
      content="Search Hanri, Tangliengim Hangul, and Lomari pronunciations from the Hokkien Tangliengim dictionary data."
    >
    <link rel="icon" href="assets/tangliengim-mark.svg?v=20260901-mobile-ime" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20260901-under-construction">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img class="brand-mark" src="assets/tangliengim-mark.svg" alt="" aria-hidden="true">
        <div>
          <p class="eyebrow">Hokkien Tangliengim</p>
          <h1>Dictionary</h1>
        </div>
      </div>
      <div class="data-status" id="dataStatus">Loading dictionary...</div>
    </header>

    <main class="app-shell">
      <p class="construction-notice">
        This website is still under construction. Entries, translations, and features are being actively refined.
      </p>

      <section class="search-panel" aria-label="Dictionary search">
        <div class="search-heading">
          <label class="search-label" for="searchInput">Search</label>
          <div class="input-mode-group">
            <button id="hangulKeyboardToggle" class="hangul-keyboard-toggle" type="button" aria-pressed="false">
              <span class="toggle-label">Enable Hangul keyboard</span>
              <span class="toggle-switch" aria-hidden="true">
                <span class="toggle-knob"></span>
              </span>
            </button>
          </div>
        </div>
        <div class="search-row">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search Hanri, Hangul, Lomari, or English..."
            autofocus
          >
          <button id="clearButton" class="icon-button" type="button" aria-label="Clear search">×</button>
        </div>

        <div class="ime-candidates" id="imeCandidates" aria-label="Hanri candidates"></div>

        <div class="quick-search" id="quickSearch" aria-label="Suggested searches"></div>
      </section>

      <section class="summary-bar" aria-live="polite">
        <span id="resultSummary">Loading entries...</span>
      </section>

      <section id="results" class="results" aria-label="Dictionary results"></section>
    </main>

    <footer class="site-footer">
      © 2026 Zhen Dong Woo. All rights reserved.
    </footer>

    <template id="resultTemplate">
      <article class="entry">
        <div class="entry-main">
          <h2 class="hanri"></h2>
          <div class="entry-meta"></div>
        </div>
        <div class="readings"></div>
      </article>
    </template>

    <script src="web-hangul-ime.js?v=20260901-mobile-ime"></script>
    <script src="app.js?v=20260901-tsv-refresh"></script>
  </body>
</html>
