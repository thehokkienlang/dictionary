<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hokkien Tangliengim Dictionary</title>
    <meta
      name="description"
      content="Search Hanri, Tangliengim Hangul, and Lomari pronunciations from the Hokkien Tangliengim dictionary data."
    >
    <link rel="icon" href="assets/tangliengim-mark.svg?v=20260901-crossmode" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css?v=20260901-crossmode">
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img class="brand-mark" src="assets/tangliengim-mark.svg" alt="" aria-hidden="true">
        <div>
          <p class="eyebrow">Hokkien Tangliengim</p>
          <h1>Dictionary</h1>
        </div>
      </div>
      <div class="data-status" id="dataStatus">Loading dictionary...</div>
    </header>

    <main class="app-shell">
      <section class="search-panel" aria-label="Dictionary search">
        <div class="search-heading">
          <label class="search-label" for="searchInput">Search</label>
          <div class="input-modes" role="radiogroup" aria-label="Input mode">
            <button class="input-mode-button active" type="button" data-input-mode="hanri-hangul" role="radio" aria-checked="true">Hanri + Hangul</button>
            <button class="input-mode-button" type="button" data-input-mode="lomari" role="radio" aria-checked="false">Lomari</button>
          </div>
        </div>
        <div class="search-row">
          <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="Type Hangul keys or Hanri, e.g. Qnsehl for 問題..."
            autofocus
          >
          <button id="clearButton" class="icon-button" type="button" aria-label="Clear search">×</button>
        </div>

        <div class="ime-candidates" id="imeCandidates" aria-label="Hanri candidates"></div>

        <div class="quick-search" id="quickSearch" aria-label="Suggested searches"></div>
      </section>

      <section class="summary-bar" aria-live="polite">
        <span id="resultSummary">Loading entries...</span>
      </section>

      <section id="results" class="results" aria-label="Dictionary results"></section>
    </main>

    <footer class="site-footer">
      © 2026 Zhen Dong Woo. All rights reserved.
    </footer>

    <template id="resultTemplate">
      <article class="entry">
        <div class="entry-main">
          <h2 class="hanri"></h2>
          <div class="entry-meta"></div>
        </div>
        <div class="readings"></div>
      </article>
    </template>

    <script src="web-hangul-ime.js?v=20260901-crossmode"></script>
    <script src="app.js?v=20260901-crossmode"></script>
  </body>
</html>
